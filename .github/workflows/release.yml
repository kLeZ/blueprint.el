name: Release

on:
  push:
    branches: [main]
    paths:
      - 'blueprint.el'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from blueprint.el
        id: extract
        run: |
          VERSION=$(grep -oP '^;; Version: \K.*' blueprint.el)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.extract.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # package-install-file only installs an uncompressed .tar that
      # holds a blueprint-pkg.el, so the package description is
      # generated from the header of blueprint.el.
      - name: Build the package tarball
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          PKG_DIR="blueprint-${VERSION}"
          SUMMARY=$(sed -n '1{s/^;;; blueprint\.el --- //;s/[[:space:]]*-\*-.*$//;p}' blueprint.el)
          REQUIRES=$(grep -oP '^;; Package-Requires: \K.*' blueprint.el)
          URL=$(grep -oP '^;; Homepage: \K.*' blueprint.el)
          mkdir "$PKG_DIR"
          cp *.el "$PKG_DIR/"
          cp -r templates "$PKG_DIR/"
          cp README.org "$PKG_DIR/" 2>/dev/null || true
          printf ';; Generated from blueprint.el  -*- no-byte-compile: t; lexical-binding: t -*-\n(define-package "blueprint" "%s" "%s"\n  (quote %s)\n  :url "%s")\n' \
            "$VERSION" "$SUMMARY" "$REQUIRES" "$URL" > "$PKG_DIR/blueprint-pkg.el"
          cat "$PKG_DIR/blueprint-pkg.el"
          tar cf "blueprint-${VERSION}.tar" "$PKG_DIR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Blueprint v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: blueprint-*.tar
