name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every Emacs version reports on its own: with fail-fast a failure on
      # one version cancelled the others and hid their results.
      fail-fast: false
      matrix:
        emacs-version: ['29.1', '29.4', 'snapshot']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      # Graphviz for the live preview test (blueprint-test-preview),
      # which renders the dependency graph with dot and is skipped
      # without it.
      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      # The Makefile loads every test/blueprint-test-*.el: a new suite
      # needs no change here.
      - name: Run ERT test suite
        run: make test
